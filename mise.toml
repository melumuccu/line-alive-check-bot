[tools]
python = "3.12"
node = "22"
pnpm = "10.11.0"
pre-commit = "4.6.0"
gitleaks = "8.30.1"

[tasks.install]
description = "Install backend and workspace dependencies"
run = """
python -m pip install --upgrade pip
python -m pip install -e .
pnpm install
"""

[tasks.dev-api]
description = "Run FastAPI app"
run = "uvicorn line_alive_check_bot.main:app --reload --host 0.0.0.0 --port 8000"

[tasks.dev-scheduler]
description = "Run scheduler worker"
run = "python -m line_alive_check_bot.scheduler"

[tasks.check]
description = "Run lightweight static checks"
run = """
python -m compileall src
if [ -d apps/web ]; then
  pnpm --filter web check
fi
"""

[tasks.test]
description = "Run tests when available"
run = """
if [ -d tests ]; then
  python -m pytest
else
  echo 'No backend tests yet'
fi
if [ -d apps/web ]; then
  pnpm --filter web test
fi
"""

[tasks.build]
description = "Build runtime containers"
run = "docker compose build"

[tasks.hooks-install]
description = "Install pre-commit and pre-push git hooks"
run = """
pre-commit install
pre-commit install --hook-type pre-push
"""

[tasks.hooks-validate]
description = "Validate pre-commit hook configuration"
run = "pre-commit validate-config"

[tasks.hooks-run-pre-commit]
description = "Run pre-commit stage hooks manually"
run = "pre-commit run --hook-stage pre-commit"

[tasks.hooks-run-pre-push]
description = "Run pre-push stage hooks manually"
run = "pre-commit run --hook-stage pre-push"

[tasks.restart-container]
description = "Restart a running project container selected via fzf"
run = '''
containers="$(docker compose ps --format json | python -c '
import json
import sys

rows = []
for raw_line in sys.stdin:
  line = raw_line.strip()
  if not line:
    continue

  container = json.loads(line)
  if container.get("State") != "running":
    continue

  rows.append("\t".join([
    container.get("Name", ""),
    container.get("Service", ""),
    container.get("Status", ""),
  ]))

if rows:
  sys.stdout.write("\n".join(rows))
')"

if [ -z "$containers" ]; then
  echo 'No running containers found for this project'
  exit 1
fi

selected_container="$(printf '%s\n' "$containers" | fzf --delimiter='\t' --with-nth=1,2,3 --prompt='Restart container > ' --height=40% --reverse | cut -f1)"

if [ -z "$selected_container" ]; then
  echo 'Canceled'
  exit 0
fi

docker restart "$selected_container"
'''
