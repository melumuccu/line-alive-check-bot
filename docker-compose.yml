services:
  api:
    build:
      context: .
    command:
      - uvicorn
      - line_alive_check_bot.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: &app-environment
      APP_DATABASE_PATH: /data/app.db
      APP_SCHEDULER_POLL_SECONDS: "60"
      APP_LINE_CHANNEL_ACCESS_TOKEN: ${APP_LINE_CHANNEL_ACCESS_TOKEN:-}
      APP_LINE_CHANNEL_SECRET: ${APP_LINE_CHANNEL_SECRET:-}
      APP_LINE_USER_ID: ${APP_LINE_USER_ID:-}
      APP_SLACK_WEBHOOK_URL: ${APP_SLACK_WEBHOOK_URL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    ports:
      - 8000:8000
    volumes:
      - sqlite_data:/data

  scheduler:
    build:
      context: .
    command:
      - python
      - -m
      - line_alive_check_bot.scheduler
    environment: *app-environment
    volumes:
      - sqlite_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
